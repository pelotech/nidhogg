apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    controller-tools.k8s.io: "1.0"
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    controller-tools.k8s.io: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      control-plane: controller-manager
      controller-tools.k8s.io: "1.0"
  template:
    metadata:
      labels:
        control-plane: controller-manager
        controller-tools.k8s.io: "1.0"
    spec:
      containers:
      - command:
        - /manager
        image: ghcr.io/pelotech/nidhogg:v0.8.1 # x-release-please-version
        imagePullPolicy: IfNotPresent
        name: manager
        args:
        - --config-file=/config/config.json
        - --leader-election
        - --leader-namespace=nidhogg-system
        - --leader-configmap=nidhogg-election
        resources:
          limits:
            memory: 200Mi
          requests:
            cpu: 100m
            memory: 200Mi
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        volumeMounts:
        - mountPath: /config
          name: config
          readOnly: true
      terminationGracePeriodSeconds: 10
      volumes:
      - name: config
        configMap:
          defaultMode: 420
          name: config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config
  namespace: system
data:
  config.json: |
    {
      "taintNamePrefix": "required.node.taint.prefix.daemonset.tolerations.have.to.start.with",
      "taintRemovalDelayInSeconds": 5,
      "nodeSelector": [
        "path.to.node.selector.where.the.ds.starts"
      ],
      "daemonsets": [
        {
          "name": "daemonset.being.observed",
          "namespace": "namespace"
        }
      ]
    }
